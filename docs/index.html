<!DOCTYPE html>
<html lang="lo">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>The 196 Haus Matcha — Local Demo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 1.5rem; background: #f7f5f0; color: #1f2d24;
      font-family: system-ui, "Sarabun", sans-serif;
    }
    main {
      width: min(520px, 100%); padding: 2rem; text-align: center;
      background: white; border-radius: 1rem;
      box-shadow: 0 8px 30px rgba(45, 90, 61, 0.12);
    }
    h1 { margin: 0 0 0.5rem; color: #2d5a3d; }
    .badge {
      display: inline-block; margin: 0.5rem 0 1rem; padding: 0.35rem 0.75rem;
      border-radius: 999px; background: #e8f1eb; color: #2d5a3d; font-weight: 700;
    }
    p { line-height: 1.65; color: #5c665f; }
    a { color: #2d5a3d; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1>The 196 Haus Matcha</h1>
    <div class="badge">Prototype / Local Demo</div>
    <p>
      ໂຄງການນີ້ເປັນ Demo ສຳລັບການສຶກສາ
      ແລະຍັງບໍ່ເປີດເປັນເວັບໃຊ້ງານຈິງ.
    </p>
    <p>
      ໃຫ້ Download source code ແລ້ວເປີດ
      <strong>RUN_DEMO.command</strong> ສຳລັບ Mac ຫຼື
      <strong>RUN_DEMO_WINDOWS.bat</strong> ສຳລັບ Windows.
    </p>
    <p><a href="https://github.com/Iboy5070/matcha_shopbeta/">ເບິ່ງ Source code ໃນ GitHub</a></p>
  </main>
</body>
</html>
