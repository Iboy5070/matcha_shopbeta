{% extends "store/base.html" %}
{% load i18n %}
{% block title %}ຕັ້ງລະຫັດສຳເລັດ{% endblock %}
{% block content %}

<div class="row justify-content-center">
  <div class="col-lg-5 col-xl-4">
    <div class="mz-auth-card text-center">
      <h1 class="mz-auth-modal-title mb-3">ສຳເລັດແລ້ວ</h1>
      <p class="text-muted mb-4">ລະຫັດຜ່ານໃໝ່ຖືກບັນທຶກແລ້ວ — ເຂົ້າສູ່ລະບົບດ້ວຍລະຫັດໃໝ່ໄດ້ເລີຍ.</p>
      <a class="btn mz-btn-primary btn-lg w-100" href="{% url 'store_login' %}">ເຂົ້າສູ່ລະບົບ</a>
    </div>
  </div>
</div>
{% endblock %}
