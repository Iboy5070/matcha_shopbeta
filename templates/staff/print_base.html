{% load static mz_extras %}
<!doctype html>
<html lang="lo">
<head>
  <meta charset="utf-8">
  <title>{% block title %}ລາຍງານ{% endblock %} — {{ shop_brand }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #1a2e22; --muted: #5a6b60; --line: #c5d0c8; --accent: #2d5a3d; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Sans Lao", sans-serif;
      color: var(--ink);
      background: #eef2ef;
      font-size: 14px;
      line-height: 1.45;
    }
    .toolbar {
      position: sticky; top: 0; z-index: 10;
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: #fff;
      border-bottom: 1px solid var(--line);
    }
    .toolbar a, .toolbar button {
      font: inherit; cursor: pointer;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      padding: 8px 14px;
      border-radius: 8px;
      text-decoration: none;
    }
    .toolbar .btn-print {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .sheet {
      max-width: 800px;
      margin: 20px auto 40px;
      background: #fff;
      padding: 32px 36px;
      border: 1px solid var(--line);
      box-shadow: 0 2px 12px rgba(0,0,0,.06);
    }
    .doc-head { text-align: center; margin-bottom: 24px; border-bottom: 2px solid var(--accent); padding-bottom: 16px; }
    .doc-head .brand { font-size: 20px; font-weight: 700; color: var(--accent); }
    .doc-head .doc-title { font-size: 18px; font-weight: 700; margin: 8px 0 4px; }
    .doc-head .doc-sub { color: var(--muted); font-size: 13px; }
    .meta { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 24px; margin-bottom: 20px; }
    .meta dt { color: var(--muted); font-size: 12px; }
    .meta dd { margin: 0 0 8px; font-weight: 600; }
    table { width: 100%; border-collapse: collapse; margin: 12px 0 20px; }
    th, td { border-bottom: 1px solid var(--line); padding: 8px 6px; text-align: left; }
    th { font-size: 12px; color: var(--muted); font-weight: 600; }
    td.num, th.num { text-align: right; }
    .totals { margin-top: 8px; }
    .totals .row { display: flex; justify-content: space-between; padding: 4px 0; }
    .totals .grand { font-size: 16px; font-weight: 700; border-top: 2px solid var(--ink); margin-top: 8px; padding-top: 10px; }
    .footer-note { margin-top: 28px; font-size: 12px; color: var(--muted); text-align: center; }
    .stamp { margin-top: 36px; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; text-align: center; font-size: 13px; }
    .stamp .line { margin-top: 48px; border-top: 1px solid var(--ink); padding-top: 6px; }
    @media print {
      body { background: #fff; }
      .toolbar { display: none !important; }
      .sheet { margin: 0; border: none; box-shadow: none; max-width: none; padding: 0; }
    }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>
  <div class="toolbar no-print">
    <div>{% block toolbar_left %}{% endblock %}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      {% block toolbar_extra %}{% endblock %}
      <button type="button" class="btn-print" onclick="window.print()">ພິມ / ເຊັດເປັນ PDF</button>
    </div>
  </div>
  <article class="sheet">
    {% block sheet %}{% endblock %}
  </article>
</body>
</html>
